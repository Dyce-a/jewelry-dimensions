<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка габаритов — редактор</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  /* Тему ставим до первой отрисовки, иначе страница мигнёт светлым. */
  (function () {
    var с = null;
    try { с = localStorage.getItem("тема"); } catch (e) {}
    var системная = window.matchMedia
      && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-тема",
      с || (системная ? "тёмная" : "светлая"));
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d97757'/%3E%3Cpath d='M8 11h16M8 21h16M11 8v16M21 8v16' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>

<!-- Иконки одним спрайтом: эмодзи в интерфейсе не используются -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="и-поиск" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/>
    </symbol>
    <symbol id="и-фильтр" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2 4h12M4.5 8h7M7 12h2" stroke-linecap="round"/>
    </symbol>
    <symbol id="и-линейка" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="1.5" y="5" width="13" height="6" rx="1"/>
      <path d="M4.5 5v2.5M7 5v1.8M9.5 5v2.5M12 5v1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="и-рамка" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2.5" y="2.5" width="11" height="11" rx="1"/>
      <circle cx="2.5" cy="2.5" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="13.5" cy="13.5" r="1.3" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="и-глаз" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M1.5 8s2.4-4 6.5-4 6.5 4 6.5 4-2.4 4-6.5 4-6.5-4-6.5-4Z"/><circle cx="8" cy="8" r="1.8"/>
    </symbol>
    <symbol id="и-обновить" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M13.5 8a5.5 5.5 0 1 1-1.7-3.9" stroke-linecap="round"/>
      <path d="M13.8 2.5v3.2h-3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-сохранить" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2.5 3.5A1 1 0 0 1 3.5 2.5h7.4l2.6 2.6v7.4a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1Z"/>
      <path d="M5 2.5v3.7h5V2.5M5 13.5v-3.7h6"/>
    </symbol>
    <symbol id="и-искра" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 1.6 9.5 6l4.4 1.5L9.5 9 8 13.4 6.5 9 2.1 7.5 6.5 6Z" stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-крест" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M4 4l8 8M12 4l-8 8" stroke-linecap="round"/>
    </symbol>
    <symbol id="и-стрелка-влево" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M10 3 5 8l5 5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-стрелка-вправо" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M6 3l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-скрепка" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M11 5.5 6 10.5a1.8 1.8 0 0 0 2.5 2.5l5.5-5.5a3.4 3.4 0 0 0-4.8-4.8L3.5 8.4a5 5 0 0 0 7 7l4-4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-чат" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2.5 4.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H7l-3.5 3v-3a1 1 0 0 1-1-1Z"
            stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-отправить" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2 8h11M8.5 3.5 13 8l-4.5 4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="и-копия" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="5.5" y="5.5" width="8" height="8" rx="1"/>
      <path d="M10.5 5.5v-2a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2"/>
    </symbol>
    <symbol id="и-таблица" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M2 6h12M6.5 6v7.5"/>
    </symbol>
    <symbol id="и-загрузка" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 11V2.5M5 5.5 8 2.5l3 3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2.5 10.5v2a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-2" stroke-linecap="round"/>
    </symbol>
    <symbol id="и-перо" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M2.5 13.5 4 9.8 10.8 3a1.7 1.7 0 0 1 2.4 2.4L6.4 12.2Z" stroke-linejoin="round"/>
      <path d="M9.6 4.2 12 6.6"/>
    </symbol>
    <symbol id="и-тема" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="8" cy="8" r="5.2"/>
      <path d="M8 2.8a5.2 5.2 0 0 0 0 10.4Z" fill="currentColor" stroke="none"/>
    </symbol>
  </defs>
</svg>

<header class="шапка">
  <div class="марка">
    Разметка габаритов
    <span class="подзаголовок">S2 · 939 позиций</span>
  </div>
  <div class="фильтры">
    <label class="поле" style="flex:1.4">
      <svg width="15" height="15"><use href="#и-поиск"/></svg>
      <input id="поиск" type="search" placeholder="ID или номенклатура" autocomplete="off">
    </label>
    <label class="поле">
      <svg width="15" height="15"><use href="#и-фильтр"/></svg>
      <select id="партия"><option value="">все партии</option></select>
    </label>
    <label class="поле">
      <select id="статус"><option value="">любой статус</option></select>
    </label>
    <label class="поле">
      <select id="набор">
        <option value="ready">только размеченные</option>
        <option value="">все позиции</option>
        <option value="manual">только с правками</option>
        <option value="upload">мои загрузки</option>
        <option value="proposed">предложенные правки</option>
      </select>
    </label>
  </div>
  <div class="счётчик" id="счётчик">загрузка…</div>
  <button class="кнопка главная" id="загрузить" title="Своё фото и пять размеров — скрипт нанесёт разметку">
    <svg width="15" height="15"><use href="#и-загрузка"/></svg> Загрузить фото
  </button>
  <button class="кнопка тихая" id="чат-сайта" title="Чат про весь редактор: вопросы и правки сайта">
    <svg width="15" height="15"><use href="#и-чат"/></svg> Чат
  </button>
  <button class="кнопка тихая" id="обучение" title="Что автомат вынес из ваших правок">
    <svg width="15" height="15"><use href="#и-искра"/></svg> Чему научился
  </button>
  <button class="кнопка тихая" id="тема" title="Переключить тему">
    <svg width="15" height="15"><use href="#и-тема"/></svg> <span id="тема-подпись">Тема</span>
  </button>
  <button class="кнопка тихая" id="выгрузить" title="Перенести запомненные статусы в Рабочую_таблицу.xlsx">
    <svg width="15" height="15"><use href="#и-таблица"/></svg> В таблицу
  </button>
</header>

<div class="приёмка" id="приёмка" hidden>
  <span>Есть предложенные правки: просмотрите их фильтром «предложенные правки».</span>
  <button class="кнопка" id="принять-все">Принять все показанные</button>
  <button class="кнопка тихая" id="отклонить-все">Отклонить все показанные</button>
</div>

<main class="галерея" id="галерея"></main>

<div class="шторка" id="шторка" hidden>
  <section class="деталь" id="деталь"></section>
</div>

<div class="лупа" id="лупа" hidden>
  <span class="подпись-лупы" id="подпись-лупы"></span>
  <img id="лупа-кадр" alt="">
</div>

<div class="тост" id="тост" hidden></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
